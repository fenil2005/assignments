<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Page</title>
    <style>
         .card-grid{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            padding: 30px;
         }
         .card{
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background-color: white;
         }
         .card img{
            width: 100%;
            height: 250px;
            object-fit: contain;
         }
         .card p{
            font-size: 18px;
            margin-top: 15px;
         }
    </style>
</head>
<body>
    <section>
        <div id="productdisplay" class="card-grid">

        </div>
    </section>
</body>
</html>
<script>
    fetch('https://dummyjson.com/products')
        .then((res) => {
            if(!res.ok) throw new Error(console.log("Response Failed"));
                return res.json();
        })
        .then((data) => {
            const prodis = document.getElementById("productdisplay");
            data.products.forEach((showalldata) => {
                const newdiv = document.createElement("newdiv");
                newdiv.innerHTML = 
                    `<div class="card">
                        <a href="http://127.0.0.1:5500/Register/Fenil_Promise/bhatt2.html?id=${showalldata.id}">
                            <img src="${showalldata.images[0]}">
                            <p>${showalldata.title}</p>
                        </a>
                    </div>
                `
                prodis.appendChild(newdiv);
            });
        })
        .catch((err) => {
            console.log("Something Error");
        })
</script>
