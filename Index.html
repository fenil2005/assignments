<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commernce</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        .search-box{
            width:400px;
            margin:20px auto;
        }

        .search-box input{
            width:100%;
            padding:12px;
            font-size:18px;
            border:1px solid gray;
            border-radius:5px;
            outline:none;
        }

        #products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:white;
            border-radius:10px;
            padding:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.2);
            text-align:center;
        }

        .card img{
            width:150px;
            height:150px;
            object-fit:contain;
        }

        .card h3{
            margin:10px 0;
        }

        .price{
            color:green;
            font-size:20px;
            font-weight:bold;
        }

        .category{
            color:gray;
            margin:8px 0;
        }

        .rating{
            color:orange;
        }

        #message{
            text-align:center;
            font-size:22px;
            margin-top:40px;
            color:red;
        }
        .inputsearch{
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

        </div>

    <section>

</body>
</html>
